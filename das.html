<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="dashboard.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">🌤 WeatherNow</div>

  <nav>
    <a href="#" class="active">Home</a>
    <a href="#">Forecast</a>
    <a href="#">Maps</a>
    <a href="#">Alerts</a>
    <a href="#">About</a>
  </nav>

  <div class="search">
    <input type="text" placeholder="Search city...">
  </div>
</header>

<!-- MAIN -->
<div class="container">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h2>📍 Kathmandu, Nepal</h2>
      <p>Monday, 5 June</p>
      <h1>28°C</h1>
      <p>Clear Sky / Sunny</p>
    </div>
  </section>

  <!-- CARDS -->
  <section class="cards">
    <div class="card">
      <h3>💧 Humidity</h3>
      <p>60%</p>
    </div>

    <div class="card">
      <h3>💨 Wind</h3>
      <p>12 km/h</p>
    </div>
  </section>

  <!-- NUMPY GRAPH -->
  <h2>NumPy Data Graph</h2>
  <canvas id="myChart"></canvas>
  <script>
    fetch("http://127.0.0.1:5000/data")
      .then(res => res.json())
      .then(data => {
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.x,
            datasets: [{
              label: 'y = x²',
              data: data.y,
              borderColor: 'blue',
              fill: false
            }]
          },
          options: {
            responsive: true
          }
        });
      })
      .catch(err => console.log('Graph data not available:', err));
  </script>

  <!-- FORECAST -->
  <section class="forecast">
    <div class="forecast-card">Tue 🌧️ 24°C</div>
    <div class="forecast-card">Wed ⛅ 26°C</div>
    <div class="forecast-card">Thu ☀️ 29°C</div>
  </section>

  <!-- TEMPERATURE CHART -->
  <h2>Weekly Temperature Forecast</h2>
  <canvas id="tempChart"></canvas>
  <script>
    const ctx = document.getElementById('tempChart');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Fri','Sat','Sun','Mon','Tue','Wed','Thu'],
        datasets: [{
          label: 'Temperature',
          data: [22,24,25,28,24,26,29],
          borderColor: '#1e88e5',
          backgroundColor: 'rgba(30,136,229,0.1)',
          tension: 0.4,
          fill: true
        }]
      },
      options: {
        responsive: true
      }
    });
  </script>

  <!-- HUMIDITY PREDICTION -->
  <section class="prediction">
    <h2>Predict Temperature from Humidity</h2>
    <label for="humidity">Enter Humidity (%):</label>
    <input type="number" id="humidity" placeholder="e.g., 60">
    <button onclick="predictTemp()">Predict</button>
  </section>

  <script>  
    async function predictTemp() {
      const humidity = document.getElementById("humidity").value;

      if (!humidity) {
        alert("Please enter a humidity value");
        return;
      }

      const response = await fetch(
        "http://127.0.0.1:5000/predict",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            humidity: humidity
          })
        }
      );

      const data = await response.json();

      alert(
        "Predicted Temp: " + data.temperature + "°C"
      );
    }
  </script>

</div>

<script src="script.js"></script>
</body>
</html>
